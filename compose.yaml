name: helpline

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: helpline
      POSTGRES_PASSWORD: helpline
      POSTGRES_DB: helpline
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpline -d helpline"]
      interval: 2s
      timeout: 5s
      retries: 30
